    <!-- CARD DE CONTENIDO SEGUN PAGINA-->
    <div class="card mx-auto" style="width: 90%; margin-top: 200px">

        <div class="card-header warning-color-dark  d-flex justify-content-start align-items-center">
            <i class="fas fa-user-plus fa-2x text-black-50"></i>
            <h5 class="font-weight-bold text-black ml-2" style="margin-bottom: 0px !important;"> Crear Usuario</h5>
        </div>


        <div class="card-body">

            <div class="col-md-12 mb-4">




                <!-- Grid row -->
                <div class="row">

                    <!-- Grid column -->
                    <div class="col-lg-6">

                        <div class="md-form form-sm mb-0">
                            <input type="text" id="form12" class="form-control form-control-sm">
                            <label for="form12" class="">Nombre</label>
                        </div>

                    </div>
                    <!-- Grid column -->

                    <!-- Grid column -->
                    <div class="col-lg-6">

                        <div class="md-form form-sm mb-0">
                            <input type="text" id="form3" class="form-control form-control-sm">
                            <label for="form3" class="">Nit / Identificación</label>
                        </div>

                    </div>

                </div>


                <div class="row mt-3">

                    <div class="col-lg-12">
                        <div class="md-form form-sm mb-0">
                            <input type="text" id="username" class="form-control form-control-sm">
                            <label for="username">Username</label>
                        </div>
                    </div>

                </div>


                <div class="row mt-3">

                    <div class="col-lg-6">

                        <select class="mdb-select colorful-select dropdown-primary md-form" multiple
                                searchable="Filtrar..">
                            <option value="" disabled selected>Seleccionar Roles</option>
                            <option value="1">Admin - ROLE_ADMIN</option>
                            <option value="2">CLI - Cliente</option>
                            <option value="3">ITE - Validar item existente en unoee</option>
                            <option value="4">JSER - Jefe servicio al cliente</option>
                            <option value="5">PRO - Proveedor</option>
                            <option value="6">SER - Servicio al cliente</option>
                            <option value="7">USER - ROLE_USER</option>
                        </select>
                        <button class="btn-save btn btn-primary btn-sm">Guardar</button>

                    </div>

                    <div class="col-lg-6">
                        <div class="md-form form-sm mb-0">
                            <input type="email" id="email" class="form-control form-control-sm">
                            <label for="email">Correo Electronico</label>
                        </div>
                    </div>

                </div>
                <!-- Grid column -->





                <div class="row mt-3">

                    <div class="col-lg-6">
                        <div class="md-form form-sm mb-0">
                            <input type="password" id="password" class="form-control form-control-sm">
                            <label for="password">Contraseña</label>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="md-form form-sm mb-0">
                            <input type="password" id="rep-password" class="form-control form-control-sm">
                            <label for="rep-password">Repetir Contraseña</label>
                        </div>
                    </div>

                </div>


                <div class="row mt-4">
                    <div class="col-lg-6">
                        <fieldset class="form-check" style="padding: 0px !important;">
                            <input class="form-check-input" type="checkbox" id="checkbox1">
                            <label class="form-check-label" for="checkbox1">Solicitar cambio al ingresar</label>
                        </fieldset>
                    </div>

                </div>








                <div class="row">
                    <div class="mt-4">
                        <button class="btn-primary btn btn-rounded" onclick="window.location.href='lista-usuarios.html'">Aceptar</button>
                    </div>

                    <div class="mt-4">
                        <button class="btn-danger btn btn-rounded" onclick="window.location.href='lista-usuarios.html'"
                        >Cancelar</button>
                    </div>

                </div>
